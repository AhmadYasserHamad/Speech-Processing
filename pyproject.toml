[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-asr"
version = "0.1.0"
description = "Multi-dialect Arabic ASR by fine-tuning Whisper-small (reimplementation of Ozyilmaz et al., Interspeech 2025)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.1",
    "transformers>=4.45,<5",
    "huggingface_hub>=0.24",
    "safetensors>=0.4",
    "pyarrow>=14",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "soundfile>=0.12",
    "jiwer>=3.0,<5",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
logging = ["tensorboard>=2.14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
