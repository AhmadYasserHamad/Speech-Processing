# E2: dialect-pooled model (our main model and the demo model).
# Starts from the E1 MSA checkpoint (the paper's "with MSA pre-training" condition) and
# fine-tunes on all five MASC dialects pooled, plus a small MSA replay share to limit the
# MSA forgetting the paper observed (45.93% -> 58.71% WER on MSA after dialect training).
#
#   python scripts/train.py --config configs/e2_pooled.yaml
#
# Paper reference (pooled, with MSA step, mean of 3 seeds, raw scoring):
#   Egyptian 79.57 | Gulf 88.39 | Iraqi 90.31 | Levantine 79.02 | Maghrebi 97.31 | MSA 56.14 (WER %)
# If E1 has not been trained yet, set model.name_or_path to otozz/whisper-small-ar_tsize_1.0.

name: e2_pooled
output_dir: ${ASR_RUNS:-runs}/e2_pooled
description: E1 checkpoint fine-tuned on five pooled MASC dialects with 15% MSA replay.

data:
  cache_dir: ${ASR_CACHE:-cache}
  train_sources: [egyptian, gulf, iraqi, levantine, maghrebi]
  msa_replay_fraction: 0.15
  text_level: light
  val_fraction: 0.2
  split_seed: 42
  speaker_disjoint_msa: true
  val_loss_samples: 2400       # 400 per source (5 dialects + MSA replay)
  val_wer_samples: 360         # 60 per source
  augmentation:
    enabled: true
    speed_perturb_prob: 0.5    # only affects MSA replay rows (dialects ship features only)
    speed_factors: [0.9, 1.1]
    gain_prob: 0.3
    gain_db: [-6.0, 6.0]
    noise_prob: 0.3
    noise_snr_db: [15.0, 40.0]
    specaugment_prob: 1.0
    freq_masks: 2
    freq_mask_width: 15
    time_masks: 4
    time_mask_max_ratio: 0.05

model:
  name_or_path: ${ASR_RUNS:-runs}/e1_msa/best
  tokenizer_name: openai/whisper-small
  language: arabic
  task: transcribe
  gradient_checkpointing: true
  freeze_encoder: false

training:
  seed: 42
  # The paper gave the pooled model the same 5,000-step budget as a single dialect even
  # though it sees ~5x more data (our Phase 1 report flags it as likely under-trained).
  # We allow 8,000 steps and let early stopping decide.
  max_steps: 8000
  batch_size: 8
  eval_batch_size: 16
  grad_accum_steps: 1
  learning_rate: 1.0e-5
  warmup_steps: 500
  adam_betas: [0.9, 0.99]
  weight_decay: 0.0
  max_grad_norm: 1.0
  precision: auto
  eval_every: 500              # larger data: evaluate less often (patience 3 = 1,500 steps)
  log_every: 25
  early_stopping_metric: val_loss
  early_stopping_patience: 3
  early_stopping_threshold: 0.001
  num_workers: 2
  val_max_new_tokens: 160
  resume: true
  save_resumable: true

hub:
  push: false
  repo_id: null                # e.g. your-username/whisper-small-ar-dialects
  private: true
